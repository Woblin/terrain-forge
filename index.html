<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Terrain Forge</title>
    <script>
      // Draws the page in the saved theme before React starts, so dark mode never flashes white.
      // The key and values match loadThemeChoice in src/services/preferences.ts.
      (function () {
        var choice = null;
        try {
          choice = localStorage.getItem('terrain-forge.theme');
        } catch (error) {
          console.warn('Could not read the saved theme; following the device.', error);
        }
        var dark =
          choice === 'dark' ||
          (choice !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
